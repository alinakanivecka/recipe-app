<button class="toggle-dropdown" type="button" (click)="toggleDropdown()" appClickOutside
  (appClickOutside)="isDropdownOpen.set(false)">
  <p>{{ selectedOption()?.name }}</p>

  <i class="fa-solid fa-chevron-down" [class.open]="isDropdownOpen()"></i>

</button>

@if (isDropdownOpen()) {
<div class="dropdown">
  @for (option of options(); track option.value) {
  <button type="button" class="dropdown-row" (click)="selectOption(option.value)">
    <i [class]="option.icon"></i>
    {{ option.label }}
  </button>
  }
</div>
}
